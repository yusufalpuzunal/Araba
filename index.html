<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-bleed 3D canvas; instrument-cluster HUD floats at the corners; garage menu as a side panel (bottom sheet on phones). */
:root{
  --ink:#0c1015;
  --glass:rgba(13,17,23,.78);
  --glass-2:rgba(22,28,36,.9);
  --line:rgba(226,234,242,.16);
  --fg:#eef2f6;
  --muted:#a2adb9;
  --amber:#ffb22e;
  --red:#ff5240;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.hud{position:fixed;inset:0;pointer-events:none;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.plate{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.plate .car{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em}
.plate .coins{font-family:var(--display);font-size:13px;color:var(--amber);letter-spacing:.06em;font-variant-numeric:tabular-nums;margin-top:2px}
.right-stack{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}
#mini{width:132px;height:132px;border-radius:50%;border:1px solid var(--line);background:var(--glass)}
.tools{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;pointer-events:auto;max-width:330px}
.tools button{background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tools button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.tools button:active{background:var(--glass-2)}

.cluster{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:168px;height:168px}
.cluster svg{width:100%;height:100%;overflow:visible}
.cluster .spd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display)}
.spd b{font-size:46px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.spd small{font-size:11px;color:var(--muted);letter-spacing:.14em;margin-top:2px}
.spd i{font-style:normal;margin-top:8px;font-size:15px;font-weight:600;color:var(--amber);border:1px solid var(--line);border-radius:6px;padding:1px 9px;background:var(--glass)}
.tells{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);display:flex;gap:6px;font-family:var(--display);font-size:10px;letter-spacing:.1em}
.tells span{padding:1px 6px;border-radius:4px;border:1px solid var(--line);background:var(--glass);color:var(--muted);opacity:.35}
.tells span.on{opacity:1}
#tBrk.on{color:var(--red);border-color:var(--red)}
#tHead.on{color:#7fd0ff;border-color:#7fd0ff}

#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:10px 18px;text-align:center;max-width:min(86vw,520px);transition:opacity .35s}
#toast.off{opacity:0}

.touch{position:fixed;inset:auto 0 0 0;height:46%;pointer-events:none}
#steerPad{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));width:44%;height:100%;pointer-events:auto;touch-action:none}
#steerPad .hint{position:absolute;left:8px;bottom:8px;font-family:var(--display);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
#steerRail{position:absolute;left:12px;right:12px;bottom:46px;height:4px;border-radius:2px;background:var(--line)}
#steerKnob{position:absolute;bottom:26px;left:50%;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--glass-2);border:2px solid var(--amber)}
.pedals{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;pointer-events:auto;align-items:end}
.pedals button{border:1px solid var(--line);background:var(--glass);border-radius:14px;font-family:var(--display);font-weight:700;letter-spacing:.08em;touch-action:none}
.pedals button.on{background:var(--glass-2);border-color:var(--amber)}
#bGas{width:84px;height:132px;grid-row:1/3;grid-column:2;color:var(--fg)}
#bBrake{width:76px;height:76px;grid-row:2;grid-column:1}
#bHand{width:76px;height:44px;grid-row:1;grid-column:1;font-size:11px;color:var(--amber)}
body.touch .cluster{right:auto;left:50%;transform:translateX(-50%) scale(.72);transform-origin:bottom center;bottom:max(6px,env(safe-area-inset-bottom,0px))}
body.touch #mini{width:104px;height:104px}
body.touch .tools{max-width:220px}

.menu{position:fixed;inset:0;display:flex;align-items:stretch;justify-content:flex-start;pointer-events:none}
.panel{pointer-events:auto;width:min(380px,100%);box-sizing:border-box;background:var(--glass-2);border-right:1px solid var(--line);overflow-y:auto;
  padding-top:max(22px,env(safe-area-inset-top,0px));padding-bottom:max(22px,env(safe-area-inset-bottom,0px));
  padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:22px;display:flex;flex-direction:column;gap:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0;letter-spacing:.02em;text-wrap:balance}
.brand h1 span{color:var(--amber)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.label{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cars{display:grid;gap:8px}
.carbtn{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.carbtn[aria-pressed="true"]{border-color:var(--amber);background:rgba(255,178,46,.08)}
.carbtn .nm{font-family:var(--display);font-weight:600;font-size:17px}
.carbtn .ty{color:var(--muted);font-size:13px}
.carbtn .sp{grid-column:2;grid-row:1/3;align-self:center;text-align:right;font-family:var(--display);font-size:12px;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}
.carbtn .sp b{color:var(--fg);font-weight:600}
.paints{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sw[aria-pressed="true"]{border-color:var(--amber)}
.timesel{display:flex;gap:8px}
.timesel button{flex:1;background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-family:var(--display);font-weight:600;letter-spacing:.04em}
.timesel button[aria-pressed="true"]{border-color:var(--amber);background:rgba(255,178,46,.08)}
#go{background:var(--amber);color:#1a1205;border:0;border-radius:12px;padding:14px 18px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.help{font-size:13px;color:var(--muted);line-height:1.6}
.help kbd{font-family:var(--display);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--fg)}
.fine{font-size:12px;color:var(--muted);opacity:.8}
@media (max-width:640px){
  .menu{align-items:flex-end}
  .panel{width:100%;max-height:62%;border-right:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));gap:14px}
  .brand h1{font-size:30px}
}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){ $('loading').textContent='3D motoru yüklenemedi. Sayfayı yenile.'; return; }
const isTouch = matchMedia('(pointer: coarse)').matches;
if(isTouch) document.body.classList.add('touch');

/* ---------- utils ---------- */
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng=mulberry(20261028);
function hash2(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy),b=hash2(ix+1,iy),c=hash2(ix,iy+1),d=hash2(ix+1,iy+1);return (a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy)*2-1}
function fbm(x,y,o){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);n+=a;a*=.5;f*=2.03}return s/n}
const C=hex=>new THREE.Color(hex).convertSRGBToLinear();
const FONT='"Barlow Condensed","Arial Narrow","Segoe UI",sans-serif';

/* ---------- world data ---------- */
const N=400,RES=4,HALF=800,W1=N+1,CITY=212;
const HB=new Float32Array(W1*W1),H=new Float32Array(W1*W1),RD=new Float32Array(W1*W1).fill(1e9),RY=new Float32Array(W1*W1);
function baseHeight(x,z){
  const dq=Math.max(Math.abs(x),Math.abs(z));
  const t=smoothstep(224,430,dq);
  let h=(fbm(x*.0022+3.1,z*.0022-1.7,5)*.5+.5)*95+fbm(x*.009,z*.009,3)*10;
  const e=smoothstep(560,790,dq);
  return h*t+e*(110+40*fbm(x*.01,z*.01,2));
}
function hAt(x,z){
  let gx=(x+HALF)/RES,gz=(z+HALF)/RES;
  gx=clamp(gx,0,N-1e-4);gz=clamp(gz,0,N-1e-4);
  const ix=gx|0,iz=gz|0,fx=gx-ix,fz=gz-iz,i=iz*W1+ix;
  return (H[i]*(1-fx)+H[i+1]*fx)*(1-fz)+(H[i+W1]*(1-fx)+H[i+W1+1]*fx)*fz;
}
function roadDist(x,z){const ix=clamp(Math.round((x+HALF)/RES),0,N),iz=clamp(Math.round((z+HALF)/RES),0,N);return RD[iz*W1+ix]}

function smoothArr(a,closed,win,passes){const n=a.length;for(let p=0;p<passes;p++){const b=a.slice();for(let i=0;i<n;i++){let s=0,c=0;for(let j=-win;j<=win;j++){let k=i+j;if(closed)k=(k+n)%n;else if(k<0||k>=n)continue;s+=b[k];c++}a[i]=s/c}}}
function makeRoad(curve,closed){
  const len=curve.getLength(),n=Math.max(2,Math.round(len/2));
  const pts=curve.getSpacedPoints(n);if(closed)pts.pop();
  const ys=pts.map(p=>baseHeight(p.x,p.z));smoothArr(ys,closed,14,4);
  return {pts,ys,closed};
}
const V3=(x,z)=>new THREE.Vector3(x,0,z);
const loopCtrl=[];for(let k=0;k<12;k++){const a=k/12*Math.PI*2;const r=(k===0||k===6)?480:470+rng()*85;loopCtrl.push(V3(Math.cos(a)*r,Math.sin(a)*r*.92))}
const loop=makeRoad(new THREE.CatmullRomCurve3(loopCtrl,true,'centripetal'),true);
function connector(ctrl,joinY){
  const r=makeRoad(new THREE.CatmullRomCurve3(ctrl,false,'centripetal'),false);const n=r.ys.length;
  for(let i=0;i<n;i++){r.ys[i]*=smoothstep(0,18,i);r.ys[i]=lerp(r.ys[i],joinY,smoothstep(n-28,n-1,i))}
  return r;
}
let westIdx=0,bd=1e9;loop.pts.forEach((p,i)=>{const d=Math.hypot(p.x+480,p.z);if(d<bd){bd=d;westIdx=i}});
const east=connector([V3(198,0),V3(260,0),V3(340,8),V3(420,-4),V3(480,0)],loop.ys[0]);
const west=connector([V3(-198,0),V3(-262,0),V3(-345,-8),V3(-420,5),V3(-480,0)],loop.ys[westIdx]);
const ROADS=[loop,east,west];

function buildHeightfield(){
  for(let iz=0;iz<W1;iz++)for(let ix=0;ix<W1;ix++)HB[iz*W1+ix]=baseHeight(-HALF+ix*RES,-HALF+iz*RES);
  const R=26;
  for(const rd of ROADS){for(let i=0;i<rd.pts.length;i++){const p=rd.pts[i],y=rd.ys[i];
    const x0=Math.max(0,Math.floor((p.x-R+HALF)/RES)),x1=Math.min(N,Math.ceil((p.x+R+HALF)/RES));
    const z0=Math.max(0,Math.floor((p.z-R+HALF)/RES)),z1=Math.min(N,Math.ceil((p.z+R+HALF)/RES));
    for(let iz=z0;iz<=z1;iz++)for(let ix=x0;ix<=x1;ix++){const d=Math.hypot(-HALF+ix*RES-p.x,-HALF+iz*RES-p.z),k=iz*W1+ix;if(d<RD[k]){RD[k]=d;RY[k]=y}}}}
  for(let k=0;k<W1*W1;k++){const w=1-smoothstep(9,24,RD[k]);H[k]=lerp(HB[k],RY[k],w)}
}

const RAMPS=[
  {x:0,z:44,dx:0,dz:-1,L:14,W:8,H:3.0},
  {x:-44,z:0,dx:1,dz:0,L:14,W:8,H:3.0},
  {x:30,z:-14,dx:0,dz:-1,L:9,W:6,H:1.4},
  {x:-30,z:14,dx:0,dz:1,L:9,W:6,H:1.4},
  {x:0,z:236,dx:0,dz:1,L:24,W:12,H:6}
];
function rampSetup(){for(const r of RAMPS){r.base=hAt(r.x,r.z);const s=r.H/r.L;r.n=new THREE.Vector3(-s*r.dx,1,-s*r.dz).normalize()}}

const G={h:0,n:new THREE.Vector3(),paved:true};
function ground(x,z,o){
  const e=1.2,h=hAt(x,z);
  o.n.set(-(hAt(x+e,z)-hAt(x-e,z))/(2*e),1,-(hAt(x,z+e)-hAt(x,z-e))/(2*e)).normalize();o.h=h;
  o.paved=(Math.abs(x)<CITY&&Math.abs(z)<CITY)||roadDist(x,z)<8.5;
  for(const r of RAMPS){const lx=x-r.x,lz=z-r.z,u=lx*r.dx+lz*r.dz;if(u<0||u>r.L)continue;const v=-lx*r.dz+lz*r.dx;if(Math.abs(v)>r.W/2)continue;
    const rh=r.base+r.H*u/r.L;if(rh>o.h){o.h=rh;o.n.copy(r.n);o.paved=true}}
  return o;
}

const OBS=new Map(),CELL=24;let obsStamp=0;
const ck=(cx,cz)=>(cx+100)*1000+(cz+100);
function addObs(o,minX,maxX,minZ,maxZ){o.s=0;for(let cx=Math.floor(minX/CELL);cx<=Math.floor(maxX/CELL);cx++)for(let cz=Math.floor(minZ/CELL);cz<=Math.floor(maxZ/CELL);cz++){const k=ck(cx,cz);let a=OBS.get(k);if(!a){a=[];OBS.set(k,a)}a.push(o)}}
function nearObs(x,z,r,out){out.length=0;obsStamp++;for(let cx=Math.floor((x-r)/CELL);cx<=Math.floor((x+r)/CELL);cx++)for(let cz=Math.floor((z-r)/CELL);cz<=Math.floor((z+r)/CELL);cz++){const a=OBS.get(ck(cx,cz));if(!a)continue;for(const o of a){if(o.s!==obsStamp){o.s=obsStamp;out.push(o)}}}return out}

/* ---------- renderer & scene ---------- */
const canvas=$('gl');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'})}catch(e){$('loading').textContent='Bu cihazda 3D grafik açılamadı.';return}
renderer.setPixelRatio(Math.min(devicePixelRatio,isTouch?1.5:1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const maxAniso=renderer.capabilities.getMaxAnisotropy();
const scene=new THREE.Scene();

function merge(geos){
  let vc=0,ic=0;for(const g of geos){vc+=g.attributes.position.count;ic+=g.index?g.index.count:g.attributes.position.count}
  const hasC=!!geos[0].attributes.color;
  const pos=new Float32Array(vc*3),nor=new Float32Array(vc*3),uv=new Float32Array(vc*2),col=hasC?new Float32Array(vc*3):null,idx=new Uint32Array(ic);
  let vo=0,io=0;
  for(const g of geos){const n=g.attributes.position.count;pos.set(g.attributes.position.array,vo*3);nor.set(g.attributes.normal.array,vo*3);uv.set(g.attributes.uv.array,vo*2);if(hasC)col.set(g.attributes.color.array,vo*3);
    if(g.index){const a=g.index.array;for(let k=0;k<a.length;k++)idx[io+k]=a[k]+vo;io+=a.length}else{for(let k=0;k<n;k++)idx[io+k]=vo+k;io+=n}vo+=n}
  const out=new THREE.BufferGeometry();out.setAttribute('position',new THREE.BufferAttribute(pos,3));out.setAttribute('normal',new THREE.BufferAttribute(nor,3));out.setAttribute('uv',new THREE.BufferAttribute(uv,2));if(hasC)out.setAttribute('color',new THREE.BufferAttribute(col,3));out.setIndex(new THREE.BufferAttribute(idx,1));out.computeBoundingSphere();return out;
}
function colorize(g,c){const n=g.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b}g.setAttribute('color',new THREE.BufferAttribute(a,3));return g}
function flatPlane(w,d,x,z,y,uScale,vScale){const g=new THREE.PlaneGeometry(w,d);g.rotateX(-Math.PI/2);g.translate(x,y,z);const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*uScale,uv.getY(i)*vScale);return g}
class QB{constructor(col){this.p=[];this.n=[];this.u=[];this.c=col?[]:null;this.i=[]}
  add(a,b,c,d,uv,n,col){const o=this.p.length/3;for(const v of [a,b,c,d])this.p.push(v[0],v[1],v[2]);for(let k=0;k<4;k++)this.n.push(n[0],n[1],n[2]);
    const [u0,v0,u1,v1]=uv;this.u.push(u0,v0,u1,v0,u1,v1,u0,v1);if(this.c)for(let k=0;k<4;k++)this.c.push(col.r,col.g,col.b);this.i.push(o,o+1,o+2,o,o+2,o+3)}
  geo(){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(this.n,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(this.u,2));if(this.c)g.setAttribute('color',new THREE.Float32BufferAttribute(this.c,3));g.setIndex(this.i);g.computeBoundingSphere();return g}}

      ping(880,1760,.25,.3);toast(coins===collectibles.length?'Tebrikler! Bütün jetonları topladın.':`Jeton ${coins} / ${collectibles.length}`,1600)}}

}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
document.addEventListener('visibilitychange',()=>{if(!audio)return;if(document.hidden)audio.ctx.suspend();else if(!menuOpen)audio.ctx.resume()});

/* ---------- boot ---------- */
function start(data){
  const build=()=>{
    try{buildWorld()}catch(err){$('loading').textContent='Dünya oluşturulamadı: '+err.message;return}
    if(data&&typeof data.car==='number'){carIdx=data.car;paintIdx=data.paint||0}
    spawnCar();
    if(data&&Array.isArray(data.got)){data.got.forEach((g,i)=>{if(g&&collectibles[i]){collectibles[i].got=true;collectibles[i].g.visible=false;coins++}});$('hudCoins').textContent=`JETON ${coins} / ${collectibles.length}`}
    setNight(!!(data&&data.night));
    renderMenu();$('menu').hidden=false;$('loading').hidden=true;
    requestAnimationFrame(t=>{last=t;frame(t)});
  };
  const fl=(document.fonts&&document.fonts.load)?Promise.race([Promise.all(['700 40px "Barlow Condensed"','600 40px "Barlow Condensed"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
  fl.catch(()=>{}).then(()=>setTimeout(build,20));
}
const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.snapshot==='function')hot.snapshot(()=>({car:carIdx,paint:paintIdx,night,got:collectibles.map(c=>c.got)}));
if(hot&&typeof hot.ready==='function')hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
