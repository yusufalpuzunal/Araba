<style>

:root{

const HW_HALF=11;
// Otoyollar: one from every city exit (N, S, E, W) to the ring road
function makeHighway(name,ctrl,o){
  const curve=new THREE.CatmullRomCurve3(ctrl,false,'centripetal');
  const n=Math.round(curve.getLength()/2),pts=curve.getSpacedPoints(n),ys=pts.map(q=>baseHeight(q.x,q.z));smoothArr(ys,false,o.smooth||16,4);

function extrudeProfile(pts,width,bev){
  const s=new THREE.Shape();s.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)s.lineTo(pts[i][0],pts[i][1]);s.closePath();
  const depth=Math.max(.05,width-bev*2);
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:bev,bevelSize:bev*.8,bevelSegments:3,curveSegments:12,steps:1});
  g.rotateY(Math.PI/2);g.translate(-depth/2,0,0);return g;
}
function bodyShapeGeo(sp){
  const s=new THREE.Shape(),ra=sp.R+.065,yw=sp.R,yb=sp.yb,xr=-sp.wb/2,xf=sp.wb/2,del=Math.asin(clamp((yw-yb)/ra,-.95,.95));
  const rearX=sp.upper[sp.upper.length-1][0]+.06,frontX=sp.upper[0][0]-.07;
  s.moveTo(rearX,yb);s.lineTo(xr-ra*Math.cos(del),yb);s.absarc(xr,yw,ra,Math.PI+del,-del,true);
  s.lineTo(xf-ra*Math.cos(del),yb);s.absarc(xf,yw,ra,Math.PI+del,-del,true);s.lineTo(frontX,yb);
  for(const [x,y] of sp.upper)s.lineTo(x,y);s.closePath();
  const bev=.08,depth=sp.W-bev*2;
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:bev,bevelSize:.06,bevelSegments:4,curveSegments:16,steps:1});
  g.rotateY(Math.PI/2);g.translate(-depth/2,0,0);return g;
}

function rearPoly(sp){const u=sp.upper,l=u[u.length-1],pts=[[l[0]+.06,sp.yb]];for(let i=u.length-1;i>=0;i--){if(u[i][0]>l[0]+.75)break;pts.push(u[i])}return pts}
function surfAt(pts,y){for(let i=0;i<pts.length-1;i++){const [x1,y1]=pts[i],[x2,y2]=pts[i+1];if((y>=y1&&y<=y2)||(y<=y1&&y>=y2)){const t=(y-y1)/((y2-y1)||1e-6);return {x:x1+(x2-x1)*t,tx:x2-x1,ty:y2-y1}}}const l=pts[pts.length-1];return {x:l[0],tx:0,ty:1}}
function spokeGeo(sp,side){const R=sp.R,n=sp.spokes,r0=R*.15,r1=R*.66,gs=[],x=side*(sp.tireW/2-.035);
  for(let k=0;k<n;k++){const b=new THREE.BoxGeometry(.035,r1-r0,sp.spokeW);b.translate(x,(r0+r1)/2,0);b.rotateX(k/n*Math.PI*2);gs.push(b)}

let toastT=0;function toast(msg,ms=2200){const t=$('toast');t.textContent=msg;t.classList.remove('off');toastT=ms/1000}

function renderMenu(){
  const cars=$('cars');cars.innerHTML='';
  CARS.forEach((sp,i)=>{const b=document.createElement('button');b.type='button';b.className='carbtn';b.id='car-'+i;b.setAttribute('aria-pressed',i===carIdx);
    b.innerHTML=`<span class="nm">${i+1}. ${sp.name}</span><span class="ty">${sp.type} · ${sp.plate}</span><span class="sp"><b>${sp.hp}</b> hp<br><b>${sp.mass.toLocaleString('tr-TR')}</b> kg</span>`;
    b.onclick=()=>{carIdx=i;spawnCar();renderMenu()};cars.appendChild(b)});
  const pa=$('paints');pa.innerHTML='';
  PAINTS.forEach(([n,h],i)=>{const b=document.createElement('button');b.type='button';b.className='sw';b.id='paint-'+i;b.title=n;b.setAttribute('aria-label',n);b.style.background=h;b.setAttribute('aria-pressed',i===paintIdx);
    b.onclick=()=>{paintIdx=i;model.paint.color.copy(C(h));renderMenu()};pa.appendChild(b)});
  $('help').innerHTML=isTouch?'Sol alttaki direksiyonu parmağınla gerçek direksiyon gibi çevir. Sağda <b>GAZ</b>, <b>FREN</b> (durunca geri vites) ve <b>EL FRENİ</b> (drift). Üstte <b>Far</b>, <b>Gece</b> ve devrilen aracı düzelten <b>Kaldır</b> var.'
   :'<kbd>W</kbd>/<kbd>↑</kbd> gaz · <kbd>S</kbd>/<kbd>↓</kbd> fren ve geri · <kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> direksiyon · <kbd>Boşluk</kbd> el freni · <kbd>L</kbd> farlar · <kbd>N</kbd> gece/gündüz · <kbd>C</kbd> kamera · <kbd>R</kbd> aracı kaldır · <kbd>M</kbd> ses · <kbd>Esc</kbd> garaj. Oyun kolu da çalışır.';
}
function openMenu(){menuOpen=true;$('menu').hidden=false;$('hud').hidden=true;$('touch').hidden=true;renderMenu();if(audio){audio.eg.gain.value=0}}
function closeMenu(){menuOpen=false;if(car)car.gear=1;$('menu').hidden=true;$('hud').hidden=false;$('touch').hidden=!isTouch;initAudio();if(audio&&audio.ctx.state==='suspended')audio.ctx.resume()}
let started=false;
$('go').onclick=()=>{closeMenu();if(!started){started=true;toast(collectibles.length+' altın jeton saklı. Işık sütunlarını takip et; şehrin dört çıkışı da otoyola bağlanıyor!',4200)}};
$('tCam').onclick=cycleCam;$('tReset').onclick=flipBack;$('tSound').onclick=toggleSound;$('tMenu').onclick=openMenu;$('tLights').onclick=toggleLights;$('tNight').onclick=()=>setNight(!night);
$('mDay').onclick=()=>setNight(false);$('mNight').onclick=()=>setNight(true);

/* ---------- camera & HUD ---------- */
const camDir=new THREE.Vector3(0,0,-1);let orbitA=0;
function updateCamera(dt){
  const sp=car.sp,p=car.p;
  if(menuOpen){orbitA+=dt*.22;const r=isTouch?8.5:7.2;camera.position.set(p.x+Math.sin(orbitA)*r,p.y+1.9,p.z+Math.cos(orbitA)*r);
    camera.lookAt(p.x,p.y+(innerWidth>640?.3:-.9),p.z);
    if(innerWidth>640){_b.set(1,0,0).applyQuaternion(camera.quaternion);camera.position.addScaledVector(_b,-1.6)}camera.fov=50;camera.updateProjectionMatrix();return}
  fwd.set(0,0,-1).applyQuaternion(car.q);
  if(camMode===2){_a.set(0,sp.beltY-sp.cgY+.2,-(sp.wsX+.35)).applyQuaternion(car.q).add(p);camera.position.copy(_a);camera.quaternion.copy(car.q);camera.fov=70;camera.updateProjectionMatrix();return}
  _b.set(fwd.x,0,fwd.z);if(_b.lengthSq()>.01){_b.normalize();if(car.v.dot(fwd)<-3)_b.negate();camDir.lerp(_b,1-Math.exp(-dt*4.5)).normalize()}
  const dist=camMode===0?6.4+sp.L*.2:11,hgt=camMode===0?2.2:3.8;
  _a.copy(p).addScaledVector(camDir,-dist);_a.y=p.y+hgt;
  camera.position.lerp(_a,1-Math.exp(-dt*7));
  ground(camera.position.x,camera.position.z,G,car.p.y);const gh=G.h+1;if(camera.position.y<gh)camera.position.y=gh;if(G.deck===2&&camera.position.y>G.h+6.4)camera.position.y=G.h+6.4;
  camera.lookAt(p.x+camDir.x*2,p.y+.9,p.z+camDir.z*2);
  if(car.impact>4)camera.position.y+=(Math.random()-.5)*Math.min(car.impact,15)*.012;
  camera.fov=60+Math.min(car.v.length()*.22,16);camera.updateProjectionMatrix();
}
const mini=$('mini'),mctx=mini.getContext('2d');
function drawMini(){
  const s=mini.width,c=s/2,f=_a.set(0,0,-1).applyQuaternion(car.q),head=Math.atan2(f.x,-f.z);
  mctx.clearRect(0,0,s,s);mctx.save();mctx.beginPath();mctx.arc(c,c,c-2,0,Math.PI*2);mctx.clip();
  mctx.translate(c,c);mctx.rotate(-head);const k=s/264*1.1;mctx.scale(k,k);mctx.translate(-(car.p.x+HALF)/2,-(car.p.z+HALF)/2);
  mctx.drawImage(mapCanvas,0,0);
  mctx.fillStyle='#ffc93c';for(const cl of collectibles)if(!cl.got){mctx.beginPath();mctx.arc((cl.x+HALF)/2,(cl.z+HALF)/2,5,0,Math.PI*2);mctx.fill()}
  mctx.fillStyle='#f4f6f8';for(const b of BOTS)mctx.fillRect((b.pos.x+HALF)/2-3,(b.pos.z+HALF)/2-3,6,6);
  mctx.restore();
  mctx.fillStyle='#ffb22e';mctx.strokeStyle='#0c1015';mctx.lineWidth=3;mctx.beginPath();mctx.moveTo(c,c-13);mctx.lineTo(c+9,c+10);mctx.lineTo(c,c+5);mctx.lineTo(c-9,c+10);mctx.closePath();mctx.stroke();mctx.fill();
}
function updateHUD(){
  const vk=Math.abs(car.v.dot(fwd.set(0,0,-1).applyQuaternion(car.q)))*3.6;
  $('spd').textContent=Math.round(vk);
  $('gear').textContent=car.gear<0?'R':(car.v.length()<.3&&inp.throttle<.05?'N':car.gear);
  const x=clamp(car.rpm/(car.sp.redline+300),0,1);$('rpmArc').setAttribute('stroke-dasharray',`${(292.2*x).toFixed(1)} 400`);
  $('rpmArc').setAttribute('stroke',car.rpm>car.sp.redline*.93?'#ff5240':'#ffb22e');
  const rz=292.2*(car.sp.redline*.93)/(car.sp.redline+300);$('redzone').setAttribute('stroke-dasharray',`0 ${rz.toFixed(1)} ${(292.2-rz).toFixed(1)} 400`);
  $('tBrk').classList.toggle('on',car.braking);$('tHead').classList.toggle('on',headOn||inTunnel);
}
let inTunnel=false;
function updateLights(){
  const lo=headOn||inTunnel;
  CM.head.emissiveIntensity=lo?3.4:.15;
  CM.tail.emissiveIntensity=lo?1.1:.1;
  CM.brake.emissiveIntensity=car.braking&&!menuOpen?5.5:(lo?.5:.04);
  CM.rev.emissiveIntensity=car.gear<0&&!menuOpen?3.2:.02;
  for(const s of model.spots)s.intensity=lo?(night||inTunnel?3.2:1.2):0;
  model.glow.intensity=car.braking&&!menuOpen?(night?2.4:.7):(headOn&&night?.35:0);
}
function updateSignals(t){const c=t%20;const Z=c<8?'g':c<10?'y':'r',X=c<10?'r':c<18?'g':c<20?'y':'r';SIG.Z=Z;SIG.X=X;
  for(const k in signalMats){const on=(k[0]==='Z'?Z:X)===k[1];signalMats[k].emissiveIntensity=on?(night?3.5:2.6):.04}}

/* ---------- main loop ---------- */
let fuelT=0,fueled=false;
let acc=0,last=performance.now(),hudT=0,prevSpeed=0,brakeFrom=0;const DT=1/120;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  readInput(dt);
  if(!menuOpen){acc+=dt;let n=0;while(acc>=DT&&n<8){car.step(DT,inp);acc-=DT;n++}if(n===8)acc=0}
  else{acc=0;car.v.multiplyScalar(.9);car.w.multiplyScalar(.9);car.step(DT,{throttle:0,brake:0,steer:0,hand:false})}
  const sp=car.sp,speed=car.v.length();
  model.root.position.copy(car.p);model.root.quaternion.copy(car.q);model.sw.rotation.z=-wAng;
  car.wheels.forEach((wh,i)=>{const mw=model.wheels[i];const ext=clamp(wh.t-sp.R,0,sp.restLen);mw.piv.position.set(wh.pos.x,wh.pos.y-ext,wh.pos.z);
    mw.piv.rotation.y=wh.front?-car.steer:0;wh.spin-=wh.vl/sp.R*dt;mw.spin.rotation.x=wh.spin;
    if(!menuOpen&&wh.contact&&wh.slip>.6&&speed>1.5){const cur=[wh.cx,wh.cy,wh.cz];if(lastMark[i]){const a=lastMark[i];const dx=cur[0]-a[0],dz=cur[2]-a[2],l=Math.hypot(dx,dz);if(l>.35){if(l<3)addSkid(a,cur,-dz/l,dx/l);lastMark[i]=cur}}else lastMark[i]=cur}else lastMark[i]=null});
  for(const cl of collectibles){if(cl.got)continue;cl.c.rotation.y+=dt*2;cl.g.position.y=cl.y+Math.sin(now*.002+cl.x)*.25;
    if(!menuOpen&&Math.hypot(car.p.x-cl.x,car.p.z-cl.z)<3.6&&Math.abs(car.p.y-cl.y)<4.5){cl.got=true;cl.g.visible=false;coins++;$('hudCoins').textContent=`JETON ${coins} / ${collectibles.length}`;
      ping(880,1760,.25,.3);toast(coins===collectibles.length?'Tebrikler! Bütün jetonları topladın.':`Jeton ${coins} / ${collectibles.length}`,1600)}}
  const upY=_a.set(0,1,0).applyQuaternion(car.q).y;
  if(!menuOpen){if(upY<.3&&speed<2.5){car.flipT+=dt;if(car.flipT>2.2)flipBack()}else car.flipT=0;
    ground(car.p.x,car.p.z,G,car.p.y);if(car.p.y<G.h-6)flipBack()}
  if(car.impact>5&&!menuOpen)thud(car.impact);car.impact=0;
  // braking event bookkeeping
  if(car.braking&&speed>3)brakeFrom=Math.max(brakeFrom,speed);
  if(!car.braking)brakeFrom=0;
  if(!menuOpen&&brakeFrom>4&&prevSpeed>.5&&speed<=.5){stopCreak();brakeFrom=0}
  prevSpeed=speed;
  if(audio&&soundOn&&!menuOpen){const t=audio.ctx.currentTime,f=car.rpm/60*2;audio.o1.frequency.setTargetAtTime(f,t,.03);audio.o2.frequency.setTargetAtTime(f*.5,t,.03);
    audio.lp.frequency.setTargetAtTime(400+car.rpm*.18+inp.throttle*600,t,.05);audio.eg.gain.setTargetAtTime(.05+.09*inp.throttle,t,.06);
    const lock=car.airborne?0:car.brakeSlip,abs=lock>.3&&speed>5?(.6+.4*Math.sin(now*.075)):1;
    const brk=car.braking&&!car.airborne?clamp((speed-3)/14,0,1)*(.3+.7*clamp(lock*1.4,0,1)):0;
    const drift=car.airborne?0:clamp((car.latSlip-.6)*.35,0,1)*.85;
    const scr=Math.max(brk,drift),bf=900+Math.min(speed,40)*7+(Math.random()-.5)*30;
    audio.scG.gain.setTargetAtTime(scr*.13*abs,t,.035);
    audio.sc1.frequency.setTargetAtTime(bf,t,.06);audio.sc2.frequency.setTargetAtTime(bf*1.52,t,.06);
    audio.f1.frequency.setTargetAtTime(bf*1.15,t,.06);audio.f2.frequency.setTargetAtTime(bf*2.3,t,.06);audio.fn.frequency.setTargetAtTime(bf*1.8,t,.06);
    audio.sg.gain.setTargetAtTime(car.airborne?0:clamp(car.latSlip*.015,0,.06),t,.05)}
  else if(audio){audio.eg.gain.value=0;audio.sg.gain.value=0;audio.scG.gain.value=0}
  {const hd=hwInfo(car.p.x,car.p.z,HI);inTunnel=!!(hd&&hd.kind===2&&Math.abs(hd.lat)<HW_HALF+1&&Math.abs(car.p.y-hd.y)<5)}
  updateBots(dt);updateDebris(dt);
  if(!menuOpen){let nearF=1e9;for(const [fx,fz] of FUEL)nearF=Math.min(nearF,Math.hypot(car.p.x-fx,car.p.z-fz));
    if(nearF<4.5&&speed<.6){fuelT+=dt;if(fuelT>1.4&&!fueled){fueled=true;toast('Depo dolduruldu! İyi yolculuklar.',2000);ping(660,660,.12,.2,'sine');ping(990,990,.25,.2,'sine')}}else{fuelT=0;if(nearF>14)fueled=false}}
  updateLights();updateSignals(now/1000);
  updateCamera(dt);
  sky.position.copy(camera.position);
  sun.position.copy(car.p).addScaledVector(sunDir,180);sun.target.position.copy(car.p);
  if(!menuOpen){hudT-=dt;if(hudT<=0){updateHUD();drawMini();hudT=1/30}}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.add('off')}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
document.addEventListener('visibilitychange',()=>{if(!audio)return;if(document.hidden)audio.ctx.suspend();else if(!menuOpen)audio.ctx.resume()});

/* ---------- boot ---------- */
function start(data){
  const build=()=>{
    try{buildWorld()}catch(err){$('loading').textContent='Dünya oluşturulamadı: '+err.message;return}
    if(data&&typeof data.car==='number'){carIdx=data.car;paintIdx=data.paint||0}
    spawnCar();spawnBots();
    if(data&&Array.isArray(data.got)){data.got.forEach((g,i)=>{if(g&&collectibles[i]){collectibles[i].got=true;collectibles[i].g.visible=false;coins++}});$('hudCoins').textContent=`JETON ${coins} / ${collectibles.length}`}
    $('hudCoins').textContent=`JETON ${coins} / ${collectibles.length}`;
    setNight(!!(data&&data.night));
    renderMenu();$('menu').hidden=false;$('loading').hidden=true;
    requestAnimationFrame(t=>{last=t;frame(t)});
  };
  const fl=(document.fonts&&document.fonts.load)?Promise.race([Promise.all(['700 40px "Barlow Condensed"','600 40px "Barlow Condensed"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
  fl.catch(()=>{}).then(()=>setTimeout(build,20));
}
const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.snapshot==='function')hot.snapshot(()=>({car:carIdx,paint:paintIdx,night,got:collectibles.map(c=>c.got)}));
if(hot&&typeof hot.ready==='function')hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
